<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Subtle border to ensure visibility on dark browser tab bars -->
  <rect width="64" height="64" rx="14" fill="#0f0f11" stroke="#2d2d30" stroke-width="2"/>
  
  <!-- Right Chevron (>) -->
  <path d="M18 20 L30 32 L18 44" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Terminal Cursor (_) -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
